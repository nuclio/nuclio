version: "2"
run:
  build-tags:
    - test_unit
    - test_integration
    - test_functional
    - test_kube
    - test_local
    - test_iguazio
    - test_broken
    - test_benchmark
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gocritic:
      disabled-checks:
        - commentFormatting
    revive:
      rules:
        - name: errorf
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: pkg/platform/kube/client
      - linters:
          - goconst
        path: _test\.go
      - path: pkg/common/k8s.go
        text: 'deprecatedComment: the proper format is `Deprecated: <text>`'
      - path: (.+)\.go$
        text: comment on
      - path: (.+)\.go$
        text: error should be the last
    paths:
      - docs
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/nuclio/nuclio/)
        - default
        - blank
        - dot
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - docs
      - vendor
      - third_party$
      - builtin$
      - examples$
