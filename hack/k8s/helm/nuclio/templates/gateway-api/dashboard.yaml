{{- if and .Values.dashboard.enabled .Values.dashboard.httpRoute.enabled }}
{{- include "nuclio.requireGatewayAPICRDs" . }}
{{- $fullName := include "nuclio.dashboardName" . -}}

# ensure parentRefs is set when gateway.enabled is false
{{- if and (empty .Values.dashboard.httpRoute.parentRefs) (not .Values.gateway.enabled) }}
{{- fail "dashboard.httpRoute.parentRefs must be set when gateway.enabled is false" }}
{{- end }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-httproute
  labels:
    app: {{ template "nuclio.name" . }}
    release: {{ .Release.Name }}
    nuclio.io/app: dashboard
    nuclio.io/class: httproute
spec:
  parentRefs:
    {{- if .Values.dashboard.httpRoute.parentRefs }}
    {{- toYaml .Values.dashboard.httpRoute.parentRefs | nindent 4 }}
    {{- else }}
    - name: {{ include "nuclio.gatewayName" . }}
    {{- end }}
  {{- with .Values.dashboard.httpRoute.hosts }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.dashboard.servicePort }}
{{- end }}
