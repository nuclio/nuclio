{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "nuclio.dashboardName" . }}
  labels:
    {{- include "nuclio.standardLabels.dashboard" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app: {{ template "nuclio.name" . }}
      release: {{ .Release.Name }}
      nuclio.io/app: dashboard
      nuclio.io/name: {{ template "nuclio.dashboardName" . }}
      nuclio.io/class: service
  template:
    metadata:
      labels:
        {{- include "nuclio.podTemplateLabels.dashboard" . | nindent 8 }}
      annotations:
        nuclio.io/version: {{ .Values.dashboard.image.tag }}
        checksum/secret-registry-credentials: {{ include (print $.Template.BasePath "/secret/registry-credentials.yaml") . | sha256sum }}
        checksum/configmap-registry-url: {{ include (print $.Template.BasePath "/configmap/registry-url.yaml") . | sha256sum }}
        checksum/configmap-platform: {{ include (print $.Template.BasePath "/configmap/platform.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ template "nuclio.serviceAccountName" . }}
      {{- include "nuclio.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.dashboard.securityContext | nindent 8 }}
      containers:
      - name: {{ template "nuclio.dashboardName" . }}
        image: {{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}
        imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
        {{- with (include "nuclio.containerSecurityContext.dashboard" .) }}
        securityContext:
          {{- . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 8070
        - name: liveness-port
          containerPort: 8082
        readinessProbe:
          httpGet:
            path: /ready
            port: liveness-port
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /live
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /live
            port: liveness-port
          failureThreshold: 4
          periodSeconds: 15
        volumeMounts:
        {{- if .Values.dashboard.writableTmpVolume }}
        # Writable scratch space for the embedded builder (build temp dirs,
        # /tmp/nuclio-builds bundles, fetched function templates). Required
        # when readOnlyRootFilesystem is enabled on the dashboard container.
        - name: tmp
          mountPath: /tmp
        {{- end }}
        {{- if .Values.dashboard.pipCACertSecretName }}
        - mountPath: /etc/ssl/certs/nuclio
          name: pip-ca-cert
          readOnly: true
        {{- end }}
        {{- if eq .Values.dashboard.containerBuilderKind "docker" }}
        - mountPath: /var/run/docker.sock
          name: docker-sock
        {{- end }}
        {{- if ne (include "nuclio.registry.credentialsSecretName" .) "" }}
        - name: registry-credentials
          mountPath: "/etc/nuclio/dashboard/registry-credentials"
          readOnly: true
        {{- end }}
        {{- if .Values.platform }}
        - name: platform-config
          mountPath: /etc/nuclio/config/platform
        {{- end }}
        {{- if .Values.dashboard.resources }}
        resources:
          {{ toYaml .Values.dashboard.resources | nindent 11 }}
        {{- end }}
        {{- $legacyBusybox := dig "initContainerImage" "busybox" (dict) .Values.dashboard.kaniko }}
        {{- $busybox := .Values.dashboard.build.initContainerImage.busybox }}
        {{- if $legacyBusybox }}{{- $busybox = $legacyBusybox }}{{- end }}
        {{- $legacyAwscli := dig "initContainerImage" "awscli" (dict) .Values.dashboard.kaniko }}
        {{- $awscli := .Values.dashboard.build.initContainerImage.awscli }}
        {{- if $legacyAwscli }}{{- $awscli = $legacyAwscli }}{{- end }}
        env:
        - name: NUCLIO_BUSYBOX_CONTAINER_IMAGE
          value: "{{ $busybox.repository }}:{{ $busybox.tag }}"
        - name: NUCLIO_AWS_CLI_CONTAINER_IMAGE
          value: "{{ $awscli.repository }}:{{ $awscli.tag }}"
        - name: NUCLIO_BUILD_PUSH_IMAGES_RETRIES
          value: {{ .Values.dashboard.kaniko.pushImagesRetries | default .Values.dashboard.build.pushImagesRetries | quote }}
        - name: NUCLIO_KANIKO_IMAGE_FS_EXTRACTION_RETRIES
          value: {{ .Values.dashboard.kaniko.imageFSExtractionRetries | quote }}
        - name: NUCLIO_AUTH_KIND
          value: {{ .Values.dashboard.authConfig.kind }}
        - name: NUCLIO_AUTH_OPTIONS_IGUAZIO_TIMEOUT
          value: {{ .Values.dashboard.authConfig.iguazio.timeout }}
        - name: NUCLIO_AUTH_IGUAZIO_VERIFICATION_URL
          value: {{ .Values.dashboard.authConfig.iguazio.sessionVerificationURL }}
        - name: NUCLIO_AUTH_IGUAZIO_VERIFICATION_METHOD
          value: {{ .Values.dashboard.authConfig.iguazio.verificationMethod }}
        - name: NUCLIO_AUTH_IGUAZIO_VERIFICATION_DATA_ENRICHMENT_URL
          value: {{ .Values.dashboard.authConfig.iguazio.sessionVerificationDataEnrichmentURL }}
        - name: NUCLIO_AUTH_IGUAZIO_CACHE_SIZE
          value: {{ .Values.dashboard.authConfig.iguazio.cacheSize | quote }}
        - name: NUCLIO_AUTH_IGUAZIO_CACHE_EXPIRATION_TIMEOUT
          value: {{ .Values.dashboard.authConfig.iguazio.cacheExpirationTimeout }}
        - name: NUCLIO_DASHBOARD_REGISTRY_URL
          valueFrom:
            configMapKeyRef:
              name: {{ template "nuclio.registry.pushPullUrlName" . }}
              key: "registry_url"
              optional: true
        - name: NUCLIO_DASHBOARD_DEPLOYMENT_NAME
          value: {{ template "nuclio.dashboardName" . }}
        - name: NUCLIO_CONTAINER_BUILDER_KIND
          value: {{ .Values.dashboard.containerBuilderKind }}
        - name: NUCLIO_KANIKO_CONTAINER_IMAGE
          value: {{ .Values.dashboard.kaniko.image.repository }}:{{ .Values.dashboard.kaniko.image.tag }}
        - name: NUCLIO_KANIKO_CONTAINER_IMAGE_PULL_POLICY
          value: {{ .Values.dashboard.kaniko.image.pullPolicy }}
        - name: NUCLIO_BUILD_JOB_DELETION_TIMEOUT
          value: {{ .Values.dashboard.kaniko.jobDeletionTimeout | default .Values.dashboard.build.jobDeletionTimeout | quote }}
        - name: NUCLIO_BUILDAH_CONTAINER_IMAGE
          value: {{ .Values.dashboard.buildah.image.repository }}:{{ .Values.dashboard.buildah.image.tag }}
        - name: NUCLIO_BUILDAH_CONTAINER_IMAGE_PULL_POLICY
          value: {{ .Values.dashboard.buildah.image.pullPolicy }}
        - name: NUCLIO_PYTHON_BASE_IMAGE_NAME
          value: {{ .Values.dashboard.build.initContainerImage.python.repository }}:{{ .Values.dashboard.build.initContainerImage.python.tag }}
        - name: NUCLIO_PYTHON_BASE_IMAGE_PULL_POLICY
          value: {{ .Values.dashboard.build.initContainerImage.python.pullPolicy }}
        - name: NUCLIO_BUILDAH_ROOTLESS_MODE
          value: {{ .Values.dashboard.buildah.rootlessMode }}
        - name: NUCLIO_BUILDAH_STORAGE_DRIVER
          value: {{ .Values.dashboard.buildah.storageDriver }}
        - name: NUCLIO_BUILDAH_ISOLATION
          value: {{ .Values.dashboard.buildah.isolation }}
        - name: NUCLIO_BUILDAH_APPARMOR_PROFILE
          value: {{ .Values.dashboard.buildah.appArmorProfile }}
        - name: NUCLIO_AZURE_CLI_CONTAINER_IMAGE
          value: {{ .Values.dashboard.build.initContainerImage.azurecli.repository }}:{{ .Values.dashboard.build.initContainerImage.azurecli.tag }}
        - name: NUCLIO_GCLOUD_CLI_CONTAINER_IMAGE
          value: {{ .Values.dashboard.build.initContainerImage.gcloudcli.repository }}:{{ .Values.dashboard.build.initContainerImage.gcloudcli.tag }}
        {{- if and .Values.dashboard.elasticSearchApiKey.secretName .Values.dashboard.elasticSearchApiKey.secretKey }}
        - name: NUCLIO_ELASTIC_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dashboard.elasticSearchApiKey.secretName }}
              key: {{ .Values.dashboard.elasticSearchApiKey.secretKey }}
        {{- else if and .Values.dashboard.elasticSearchPassword.secretName .Values.dashboard.elasticSearchPassword.secretKey }}
        - name: NUCLIO_ELASTIC_SEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.dashboard.elasticSearchPassword.secretName }}
              key: {{ .Values.dashboard.elasticSearchPassword.secretKey }}
        {{- end }}
        {{- if or .Values.dashboard.kaniko.insecurePushRegistry .Values.dashboard.build.insecurePushRegistry }}
        - name: NUCLIO_BUILD_INSECURE_PUSH_REGISTRY
          value: "true"
        {{- end }}
        {{- if or .Values.dashboard.kaniko.insecurePullRegistry .Values.dashboard.build.insecurePullRegistry }}
        - name: NUCLIO_BUILD_INSECURE_PULL_REGISTRY
          value: "true"
        {{- end }}
        {{- if .Values.registry.defaultBaseRegistryURL }}
        - name: NUCLIO_DASHBOARD_DEFAULT_BASE_REGISTRY_URL
          value: {{ .Values.registry.defaultBaseRegistryURL }}
        {{- end }}
        {{- if .Values.registry.defaultOnbuildRegistryURL }}
        - name: NUCLIO_DASHBOARD_DEFAULT_ONBUILD_REGISTRY_URL
          value: {{ .Values.registry.defaultOnbuildRegistryURL }}
        {{- end }}
        {{- if .Values.registry.dependantImageRegistryURL }}
        - name: NUCLIO_DASHBOARD_DEPENDANT_IMAGE_REGISTRY_URL
          value: {{ .Values.registry.dependantImageRegistryURL }}
        {{- end }}
        {{- if or .Values.dashboard.kaniko.cacheRepo .Values.dashboard.build.cacheRepo }}
        - name: NUCLIO_BUILD_CACHE_REPO
          value: {{ .Values.dashboard.kaniko.cacheRepo | default .Values.dashboard.build.cacheRepo }}
        {{- end }}
        {{- if or .Values.dashboard.kaniko.defaultServiceAccount .Values.dashboard.build.defaultServiceAccount }}
        - name: NUCLIO_BUILD_DEFAULT_SERVICE_ACCOUNT
          value: {{ .Values.dashboard.kaniko.defaultServiceAccount | default .Values.dashboard.build.defaultServiceAccount }}
        {{- end }}
        {{- if or .Values.dashboard.kaniko.podLabels .Values.dashboard.build.podLabels }}
        - name: NUCLIO_BUILD_POD_LABELS
          value: {{ (.Values.dashboard.kaniko.podLabels | default .Values.dashboard.build.podLabels) | toJson | quote }}
        {{- end }}
        {{- if .Values.registry.runRegistryURL }}
        - name: NUCLIO_DASHBOARD_RUN_REGISTRY_URL
          value: {{ .Values.registry.runRegistryURL }}
        {{- end }}
        {{- if eq .Values.dashboard.baseImagePullPolicy "Never" }}
        - name: NUCLIO_DASHBOARD_NO_PULL_BASE_IMAGES
          value: "true"
        {{- end }}
        {{- if .Values.offline }}
        - name: NUCLIO_DASHBOARD_OFFLINE
          value: "true"
        {{- end }}
        {{- if not (eq .Values.dashboard.templates.archiveAddress "nil") }}
        - name: NUCLIO_TEMPLATES_ARCHIVE_ADDRESS
          value: {{ .Values.dashboard.templates.archiveAddress }}
        - name: NUCLIO_TEMPLATES_GIT_REPOSITORY
          value: "nil"
        - name: NUCLIO_TEMPLATES_GIT_REF
          value: "nil"
        {{- else }}
        - name: NUCLIO_TEMPLATES_GIT_REPOSITORY
          value: {{ .Values.dashboard.templates.gitRepository }}
        - name: NUCLIO_TEMPLATES_GIT_REF
          value: {{ .Values.dashboard.templates.getRef }}
        {{- end }}
        - name: NUCLIO_MONITOR_DOCKER_DAEMON
          value: {{ .Values.dashboard.monitorDockerDeamon.enabled | quote }}
        - name: NUCLIO_MONITOR_DOCKER_DAEMON_INTERVAL
          value: {{ .Values.dashboard.monitorDockerDeamon.interval | quote }}
        - name: NUCLIO_MONITOR_DOCKER_DAEMON_MAX_CONSECUTIVE_ERRORS
          value: {{ .Values.dashboard.monitorDockerDeamon.maxConsecutiveErrors | quote }}
        - name: NUCLIO_REGISTRY_CREDENTIALS_SECRET_NAME
          value: {{ template "nuclio.registry.credentialsSecretName" . }}
        {{- if len .Values.registry.secretNames }}
        - name: NUCLIO_REGISTRY_CREDENTIALS_SECRET_NAMES
          value: {{ template "nuclio.registry.credentialsSecretNames" . }}
        {{- end }}
        {{- if .Values.registry.kind }}
        - name: NUCLIO_REGISTRY_KIND
          value: {{ .Values.registry.kind }}
        {{- end }}
        {{- if or .Values.dashboard.kaniko.registryProviderSecretName .Values.dashboard.build.registryProviderSecretName }}
        - name: NUCLIO_BUILD_REGISTRY_PROVIDER_AUTH_SECRET_NAME
          value: {{ .Values.dashboard.kaniko.registryProviderSecretName | default .Values.dashboard.build.registryProviderSecretName | quote }}
        {{- end }}
        - name: NUCLIO_DASHBOARD_EXTERNAL_IP_ADDRESSES
          value: {{ template "nuclio.externalIPAddresses" . }}
        - name: NUCLIO_DASHBOARD_IMAGE_NAME_PREFIX_TEMPLATE
          value: {{ .Values.dashboard.imageNamePrefixTemplate | quote }}
      {{- if .Values.dashboard.opa.enabled }}
      - name: {{ template "nuclio.name" . }}-{{ .Values.dashboard.opa.name }}
        securityContext:
          {{- toYaml .Values.dashboard.opa.securityContext | nindent 12 }}
        image: "{{ .Values.dashboard.opa.image.repository }}:{{ .Values.dashboard.opa.image.tag }}"
        imagePullPolicy: {{ .Values.dashboard.opa.image.pullPolicy }}
        ports:
          - name: http
            containerPort: {{ .Values.dashboard.opa.port }}
        {{- if .Values.dashboard.opa.livenessProbe }}
        livenessProbe:
          {{ toYaml .Values.dashboard.opa.livenessProbe | nindent 12 }}
        {{- end }}
        {{- if .Values.dashboard.opa.readinessProbe }}
        readinessProbe:
          {{ toYaml .Values.dashboard.opa.readinessProbe | nindent 12 }}
        {{- end }}
        resources:
          {{- toYaml .Values.dashboard.opa.resources | nindent 12 }}
        args:
          - "run"
          - "--server"
          - "--addr=0.0.0.0:{{ .Values.dashboard.opa.port }}"
          - "--config-file=/config/config.yaml"
          - "--log-level={{ .Values.dashboard.opa.logLevel }}"
          - "--log-format={{ .Values.dashboard.opa.logFormat }}"
          - "--ignore=.*"
          {{- range .Values.dashboard.opa.extraArgs }}
          - {{ . | quote }}
          {{- end }}
        volumeMounts:
          - readOnly: true
            mountPath: /config
            name: opa-config
      {{- end }}
      volumes:
      {{- if .Values.dashboard.writableTmpVolume }}
      - name: tmp
        emptyDir: {}
      {{- end }}
      {{- if .Values.dashboard.pipCACertSecretName }}
      - name: pip-ca-cert
        secret:
          secretName: {{ .Values.dashboard.pipCACertSecretName }}
          items:
            - key: pip-ca-certificates.crt
              path: pip-ca-certificates.crt
              mode: 0400
      {{- end }}
      {{- if eq .Values.dashboard.containerBuilderKind "docker" }}
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
      {{- end }}
      {{- if ne (include "nuclio.registry.credentialsSecretName" .) "" }}
      - name: registry-credentials
        secret:
          secretName: {{ template "nuclio.registry.credentialsSecretName" . }}
          optional: true
      {{- end }}
      {{- if .Values.platform }}
      - name: platform-config
        configMap:
          name: {{ template "nuclio.platformConfigName" . }}
      {{- end }}
      {{- if .Values.dashboard.opa.enabled }}
      - name: opa-config
        secret:
          secretName: {{ template "nuclio.dashboard.opa.fullname" . }}
      {{- end }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
      {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
      {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
      {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dashboard.priorityClassName }}
      priorityClassName: {{ .Values.dashboard.priorityClassName | quote }}
      {{- end }}
{{- end }}
