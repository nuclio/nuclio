name: Benchmark Report

on:
  # manual trigger for any branch/PR
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to comment on'
        required: true
        type: number
  schedule:
    # weekly schedule, e.g. every Sunday midnight UTC
    - cron: '0 0 * * 0'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          cache: true
          go-version-file: go.mod

      - name: Fetch nuclio docker images
        uses: actions/download-artifact@v4
        with:
          name: nuclio-docker-images

      - name: Load nuclio docker images
        run: |
          make load-docker-images
          rm nuclio-docker-images*.tar.gz

      - name: Run benchmarks tests
        run: |
          make test-docker-benchmark-python
          # Assuming benchmark_report.txt is generated by tests
          cat benchmark_report.txt

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark_report.txt

      - name: Read benchmark report
        id: read_report
        run: |
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          cat benchmark_report.txt >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment benchmark report on PR (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.inputs.pr_number }}
          body: |
            ### 🔍 Benchmark Report

            ${{ steps.read_report.outputs.report }}

      - name: Send benchmark report to Slack (weekly only)
        if: github.event_name == 'schedule'
        uses: rtCamp/action-slack-notify@v2
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          message: |
            *Weekly Benchmark Report*:

            ${{ steps.read_report.outputs.report }}
