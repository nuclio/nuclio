name: Release

run-name: Releasing ${{ inputs.version }} (${{ github.ref_name }})
env:
  REPO: quay.io
  REPO_NAME: nuclio
  CACHE_REPO: ghcr.io
  CACHE_REPO_NAME: ${{ github.repository_owner }}
  DOCKER_BUILDKIT: 1

permissions:

  # Allow the action to upload artifact to releases
  contents: write

  # Allow the action to upload cache images
  packages: write


on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release. if not provided, will be calculated from the current version and bump_version_mode'
        default: ''
        type: string
      bump_version_mode:
        description: 'The version bump mode. Whether to bump rc version or set stable version'
        default: 'bump-minor'
        type: choice
        options: [ 'bump-minor', 'bump-major', 'bump-patch']
      target_version:
        description: 'Target version. Optional'
        required: false
        default: ''
      skip_create_tag_release:
        description: 'Whether to skip creating tag & release in Github (Auto skip for feature branch)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
      docker_image_rule:
        description: 'Docker image rule to build and release (space separated)'
        required: false
        default: ''

jobs:
  prepare-inputs:
    name: Prepare inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      helm_version: ${{ steps.resolve.outputs.helm_version }}
    steps:
      - uses: actions/checkout@v4
        with:

          # Fetch all history for all tags and branches
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'  # Set Go version as needed

      - name: Run Go script
        run: |
          make get-release-info BUMP_VERSION_MODE=${{ inputs.bump_version_mode }} TARGET_VERSION=${{ inputs.target_version }}
        # Go script will set the environment variable RELEASE_VERSION

      - name: Resolve inputs
        id: resolve
        run: |
          VERSION_INPUT=$(make get-target-version)
          echo "VERSION_INPUT=${VERSION_INPUT}"
          echo "version=${VERSION_INPUT}" >> $GITHUB_ENV
          HELM_VERSION_INPUT=$(make get-helm-target-version)
          echo "HELM_VERSION_INPUT=${HELM_VERSION_INPUT}"
          echo "helm_version=${HELM_VERSION_INPUT}" >> $GITHUB_ENV

  create-tag:
    name: Create tag v${{ needs.prepare-inputs.outputs.version }}
    runs-on: ubuntu-latest

    # run this specific job for feature branch only as we wont have a github release for it
    # the tag would be useful to track feature branch released versions
    if: needs.prepare-inputs.outputs.is_feature_branch == 'true'
    needs: [ prepare-inputs]
    steps:
      - name: Create feature branch tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ needs.prepare-inputs.outputs.version }}',
              sha: context.sha
            })

  update-release-notes:
    name: Update release notes
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_create_tag_release != 'true'
    needs: [prepare-inputs]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.9
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt
      - name: Set up GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/install.sh | sh
          gh --version

      - name: Generate Release Notes and Create Release
        run: |
          # Generate release notes based on commits
          gh release create ${{ github.ref }} --title "Release ${{ github.ref }}" --notes "$(git log $(git describe --tags --abbrev=0)..${GITHUB_REF} --pretty=format:'%s')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  helm-publish-create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:

          # Fetch all history for all tags and branches
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'  # Set Go version as needed

      - name: Make changes to files
        run: |
          make release-helm-charts BUMP_VERSION_MODE=${{ inputs.bump_version_mode }} TARGET_VERSION=${{ inputs.target_version }}

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"

      - name: Create new branch
        run: |
          HELM_VERSION_INPUT=$(make get-helm-target-version)
          echo "HELM_VERSION_INPUT=${HELM_VERSION_INPUT}"
          git checkout -b update-helm-charts-${HELM_VERSION_INPUT}

      - name: Commit changes
        run: |
          git add .
          git commit -m "Automated changes from GitHub Action"

      - name: Push changes to new branch
        run: |
          git push --set-upstream origin update-helm-charts-${HELM_VERSION_INPUT}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "[Helm] Bump helm charts"
          body: "This PR contains changes automatically generated by the CI `release` pipeline."
          head: update-files-branch
          base: ${{ github.ref_name }}