name: Mark Stable

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to mark as stable (e.g., 1.2.3).'
        required: true
        type: string

env:
  REPO: quay.io
  REPO_NAME: nuclio
  DOCKER_BUILDKIT: 1

jobs:
  image_matrix_prep:
    name: Prepare image list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Define targets
        id: set-matrix
        run: |
          docker_image_rules_json=$(make print-docker-image-rules-json)
          echo $docker_image_rules_json
          echo "matrix=$(echo $docker_image_rules_json | jq -c '[.[].image_rule]')" >> $GITHUB_OUTPUT

  tag-and-push-images:
    name: Tag and Push Stable Images
    needs: image_matrix_prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - amd64
        docker_image_rule: ${{ fromJson(needs.image_matrix_prep.outputs.matrix) }}
    steps:
      - name: Prepare environment
        run: |
          echo "NUCLIO_DOCKER_REPO=${{ env.REPO }}/${{ env.REPO_NAME }}" >> $GITHUB_ENV
          echo "NUCLIO_ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REPO }}
          username: ${{ secrets.QUAYIO_DOCKER_USERNAME }}
          password: ${{ secrets.QUAYIO_DOCKER_PASSWORD }}

      - name: Tag and push stable images
        run: |
          docker pull "$NUCLIO_DOCKER_REPO/${{ matrix.docker_image_rule }}:${{ env.VERSION }}-$NUCLIO_ARCH"
          docker tag "$NUCLIO_DOCKER_REPO/${{ matrix.docker_image_rule }}:${{ env.VERSION }}-$NUCLIO_ARCH" "$NUCLIO_DOCKER_REPO/${{ matrix.docker_image_rule }}:stable-$NUCLIO_ARCH"
          docker push "$NUCLIO_DOCKER_REPO/${{ matrix.docker_image_rule }}:stable-$NUCLIO_ARCH"

  update-badge:
    name: Create PR to update stable badge
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"

      - name: Run Make target to update badge
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: make update-stable-badge VERSION=${VERSION}

      - name: Create branch for badge update
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BRANCH_NAME="update-stable-badge-v${VERSION}"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[Readme] Update stable badge to v${{ env.VERSION }}"
          base: development
          branch: ${{ env.BRANCH_NAME }}
          title: "Update stable badge to v${{ env.VERSION }}"
          body: |
            This PR updates the stable badge in `README.md` to version **v${{ env.VERSION }}**.
            
            ⚠️ **Reminder:**  
            Please make sure to **manually retag stable** tag **before merging** this PR. Example:
            `UPSTREAM=nuclio TAG=1.14.14 && git fetch $UPSTREAM tag $TAG && git tag -f stable $TAG && git push $UPSTREAM stable --force`
          delete-branch: true
