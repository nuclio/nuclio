name: Mark Stable

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to mark as stable (e.g., 1.2.3).'
        required: true
        type: string

env:
  REPO: quay.io
  REPO_NAME: nuclio
  DOCKER_BUILDKIT: 1
  GITHUB_ACTIONS_BOT_NAME: github-actions[bot]
  GITHUB_ACTIONS_BOT_EMAIL: github-actions[bot]@users.noreply.github.com

jobs:
  image_matrix_prep:
    name: Prepare image list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Define targets
        id: set-matrix
        run: |
          docker_image_rules_json=$(make print-docker-image-rules-json)

          # If "handler-builder-golang-onbuild" is in the matrix,
          # then ensure "handler-builder-golang-onbuild-alpine" is there too.
          docker_image_rules_json=$(echo $docker_image_rules_json | \
            jq -c 'if any(.[]; .image_rule == "handler-builder-golang-onbuild") 
                   then . + [{"image_rule":"handler-builder-golang-onbuild-alpine"}] 
                   else . end')

          echo $docker_image_rules_json
          echo "matrix=$(echo $docker_image_rules_json | jq -c '[.[].image_rule]')" >> $GITHUB_OUTPUT

  tag-and-push-images:
    name: Tag and Push Stable Images
    needs: image_matrix_prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - amd64
        docker_image_rule: ${{ fromJson(needs.image_matrix_prep.outputs.matrix) }}
    steps:
      - name: Prepare environment
        run: |
          echo "NUCLIO_DOCKER_REPO=${{ env.REPO }}/${{ env.REPO_NAME }}" >> $GITHUB_ENV
          echo "NUCLIO_ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REPO }}
          username: ${{ secrets.QUAYIO_DOCKER_USERNAME }}
          password: ${{ secrets.QUAYIO_DOCKER_PASSWORD }}

      - name: Tag and push stable images
        run: |
          docker pull "$NUCLIO_DOCKER_REPO/${{ matrix.docker_image_rule }}:${{ env.VERSION }}-$NUCLIO_ARCH"
          docker tag "$NUCLIO_DOCKER_REPO/${{ matrix.docker_image_rule }}:${{ env.VERSION }}-$NUCLIO_ARCH" "$NUCLIO_DOCKER_REPO/${{ matrix.docker_image_rule }}:stable-$NUCLIO_ARCH"
          docker push "$NUCLIO_DOCKER_REPO/${{ matrix.docker_image_rule }}:stable-$NUCLIO_ARCH"

  update-stable-branch:
    name: Update GitHub Stable Branch
    needs: image_matrix_prep
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push branches with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "${{ env.GITHUB_ACTIONS_BOT_NAME }}"
          git config --global user.email "${{ env.GITHUB_ACTIONS_BOT_EMAIL }}"

      - name: Update stable via PR
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PR_BRANCH="stable-update-$VERSION"
  
          # Check if the version tag exists
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            # Create a branch from the version commit
            git checkout -b "$PR_BRANCH" "$VERSION"
  
            # Push the branch to origin
            git push origin "$PR_BRANCH" --force
  
            # Create a PR into stable using GitHub CLI
            gh pr create \
              --title "Update stable to $VERSION" \
              --body "Automated update of stable branch to $VERSION" \
              --base stable \
              --head "$PR_BRANCH"
  
            echo "✅ Created PR from $PR_BRANCH to stable"
          else
            echo "::error::Version tag $VERSION does not exist in the repository."
            exit 1
          fi