version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jerusalem"
    commit-message:
      prefix: "[Dependabot] "
    open-pull-requests-limit: 6
    cooldown:
      default-days: 3
    groups:
      github-actions-ci-patch:
        update-types: ["patch"]
        patterns:
          - "actions/checkout"
          - "actions/download-artifact"
          - "actions/setup-go"
          - "actions/upload-artifact"
          - "azure/setup-helm"
          - "denoland/setup-deno"
          - "docker/login-action"
          - "manusa/actions-setup-minikube"
      github-actions-patch:
        update-types: ["patch"]

  - package-ecosystem: "npm"
    directory: "/pkg/dashboard/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jerusalem"
    commit-message:
      prefix: "[Dependabot] "
    open-pull-requests-limit: 6
    cooldown:
      default-days: 7
    groups:
      dashboard-ui-patch:
        dependency-type: "production"
        update-types: ["patch"]
        # not used by the production build that CI runs (UI tests, dev and preview servers only)
        exclude-patterns:
          - "angular-mocks"
          - "express"
          - "express-http-proxy"
      dashboard-ui-dev-patch:
        dependency-type: "development"
        update-types: ["patch"]
    ignore:
      # bootstrap 5.x is a breaking major bump that broke the UI (see PR #4306, #4321, #4322)
      - dependency-name: "bootstrap"
      # Babel 8 (core + preset-env) needs Node >=22.18; UI build image is node:20
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-angular 5+ needs eslint 9 (flat config); UI lint runs eslint 6 via gulp-eslint
      - dependency-name: "eslint*"
        update-types: ["version-update:semver-major"]
      # iguazio.dashboard-controls uses the monaco 0.13 API; upgrade both together
      - dependency-name: "monaco-editor"

  - package-ecosystem: "npm"
    directory: "/pkg/processor/runtime/nodejs/js"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[Dependabot] "
    # security updates only, no version updates
    open-pull-requests-limit: 0
    ignore:
      # eslint and its config/plugins must be upgraded together; separate bumps break npm install
      - dependency-name: "eslint*"
