plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.9'
    implementation group: 'commons-cli', name: 'commons-cli', version: '1.5.0'

    implementation files('./nuclio-sdk-java-1.1.0.jar')
    implementation files('./user-handler.jar')
}

jar {
    manifest {
        attributes(
                'Main-Class': 'io.nuclio.processor.Wrapper'
        )
    }
}

shadowJar {
    archiveBaseName = 'nuclio-java-wrapper'
    archiveClassifier = ''
}

// This is the task build-handler.sh is running
task wrapperJar(dependsOn: shadowJar)
